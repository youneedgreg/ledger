name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_NO_SYNC: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"
          enable-cache: true
      - run: uv sync --locked --all-packages
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      # Integration tests start a real Postgres through testcontainers.
      - name: Test
        run: uv run pytest services/ledger-core -q

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  stack:
    name: Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create throwaway passwords
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "LEDGER_APP_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "LEDGER_RELAY_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "LEDGER_RECONCILER_DB_PASSWORD=$(openssl rand -hex 32)"
          } > .env
      # The core's health check is /readyz, so this also proves it reached Postgres as ledger_app.
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check the gateway
        run: curl --fail --silent --show-error http://127.0.0.1:3000/healthz
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # The single check that branch protection requires, so jobs can change without touching the rule.
  ci-passed:
    name: CI passed
    if: always()
    needs: [python, typescript, secrets, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
