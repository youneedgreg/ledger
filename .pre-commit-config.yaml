# Install with: uv run pre-commit install
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 81d3af62ea96a1f69f0cfa8745f253d3c4740896  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run --all-packages mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: pnpm lint
        language: system
        files: \.(ts|mjs)$
        pass_filenames: false
      - id: tsc
        name: tsc --strict
        entry: pnpm typecheck
        language: system
        files: \.ts$
        pass_filenames: false
      - id: unit-tests
        name: unit tests
        entry: sh -c 'uv run --all-packages pytest services/ledger-core -q -m "not integration" && pnpm test'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
